plugins {
    id 'com.android.application'
}
android {
    namespace 'pl.sektor.galacticcommand'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.sektor.galacticcommand'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName 'B-1.0.9'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
